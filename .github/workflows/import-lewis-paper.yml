name: Import Lewis reference paper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-lewis-paper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Lewis (2001) paper
        run: |
          mkdir -p docs
          curl --fail --location --retry 3 --retry-delay 2 \
            --output docs/lewis-2001-simple-option-formula.pdf \
            'https://papers.ssrn.com/sol3/Delivery.cfm/SSRN_ID282110_code010905670.pdf?abstractid=282110&mirid=1'
          test -s docs/lewis-2001-simple-option-formula.pdf
          head -c 4 docs/lewis-2001-simple-option-formula.pdf | grep -q '%PDF'

      - name: Commit paper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lewis-2001-simple-option-formula.pdf
          if git diff --cached --quiet; then
            echo 'Paper already present; nothing to commit.'
          else
            git commit -m 'Add Lewis option-pricing reference paper'
            git push
          fi
