[project]
name = "stochastic-modeling"
version = "0.1.0"
description = "Reproducible environment for the MScFE 622 Stochastic Modeling Group Work Project 1"
requires-python = "==3.14.*"
dependencies = [
    "ipykernel==7.3.0",
    "ipywidgets==8.1.8",
    "jupyterlab==4.6.2",
    "matplotlib==3.11.1",
    "nbconvert==7.17.1",
    "notebook==7.6.1",
    "numpy==2.5.1",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "pdfplumber==0.11.10",
    "pymupdf==1.28.0",
    "pypdf==6.14.2",
    "reportlab==5.0.0",
    "scipy==1.18.0",
    "seaborn==0.13.2",
    "tabulate==0.10.0",
    "tqdm==4.70.0",
    "xlsxwriter==3.2.9",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stochastic_modeling"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "playwright==1.61.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "uv==0.12.1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=stochastic_modeling --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "NPY"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["stochastic_modeling"]
omit = ["src/stochastic_modeling/notebook_runtime.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
